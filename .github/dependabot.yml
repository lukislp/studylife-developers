# Weekly Dependabot updates: GitHub Actions, NuGet (grouped) and the Dockerfile.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "fix(ci)"
    reviewers:
      - "lukislp"
    open-pull-requests-limit: 2
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 2
    groups:
      dotnet:
        patterns: ["Microsoft.*", "System.*", "Npgsql.*"]
    commit-message:
      prefix: "fix(deps)"
    reviewers:
      - "lukislp"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "fix(docker)"
    reviewers:
      - "lukislp"
    open-pull-requests-limit: 2
