# The public root certificate of StudyLife's own cluster-internal cert-manager CA
# (studylife-internal-ca-issuer, secret cert-manager/studylife-internal-ca in the studylife
# repo's k8s/07b-cert-manager-issuers.yaml) - NOT the private key, which never leaves that
# secret. Public certificate data, safe to commit: knowing it only lets a client verify certs
# signed by this CA, it grants no ability to issue new ones. Identical content to
# studylife-ai's own k8s/06-studylife-ca.yaml and studylife-mcp's own k8s/03-studylife-ca.yaml -
# a ConfigMap is namespace-scoped, so this is a deliberate duplicate, not a divergence.
# Flux-managed (see k8s/flux-deploy/kustomization.yaml) - unlike Secrets this resource kind IS
# within kustomize-controller's granted RBAC.
apiVersion: v1
kind: ConfigMap
metadata:
  name: studylife-internal-ca
  namespace: studylife-developers
