# Same strategy as studylife-webhooks' own k8s/04-network-policies.yaml: default-deny ingress
# as a baseline, egress stays open (this portal calls out to whichever StudyLife instance it's
# paired with). Bootstrap-only, NOT Flux-managed - kustomize-controller's ClusterRole has no
# "networkpolicies" permission.
#
# Also wires up the shared NGF Gateway's ingress to the portal's own UI (see
# k8s/06-httproute.yaml) - allow-nginx-gateway-to-app below, same pattern as studylife-web's own
# allow-nginx-gateway-to-web in the studylife repo's k8s/12-network-policies.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: studylife-developers
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: studylife-developers
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - {} # egress otherwise unrestricted - this policy only adds an explicit DNS allowance
---
# studylife-scale has no default-deny egress, so studylife-web can already reach out
# cross-namespace by default - this rule is the only side that needs to explicitly allow
# anything, admitting exactly the studylife-web pod's calls to /internal/register-key/
# revoke-key (DeveloperProxyClient).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-studylife-web-to-app
  namespace: studylife-developers
spec:
  podSelector: { matchLabels: { app: studylife-developers } }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: studylife-scale } }
          podSelector: { matchLabels: { app: studylife-web } }
      ports:
        - { protocol: TCP, port: 8080 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-nginx-gateway-to-app
  namespace: studylife-developers
spec:
  podSelector: { matchLabels: { app: studylife-developers } }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: nginx-gateway } }
      ports:
        - { protocol: TCP, port: 8080 }
---
# The portal's only outbound dependency: the StudyLife API it is paired with
# (StudyLife__BaseUrl = https://studylife-web.studylife-scale.svc.cluster.local, see
# k8s/01-config.yaml and Services/StudyLifeApiClient.cs - GET/POST /api/developer/*,
# /internal/register-key/revoke-key). NetworkPolicy matches the POD port, not the Service
# port: studylife-scale's studylife-web Service maps 443 -> 8443 and 80 -> 8080, so the
# HTTPS base URL above lands on container port 8443. Port 8080 is allowed alongside it so
# switching StudyLife__BaseUrl to plain HTTP does not need another policy change.
#
# Nothing else here talks to the outside world: no internet calls (the StudyLife CA is a
# mounted file, not an OCSP/CRL fetch), no database (DataDir is a local PVC), no Kubernetes
# API. DNS is covered by allow-dns above, and kubelet probes are not subject to
# NetworkPolicy at all (they originate from the node, not from a pod).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: studylife-developers-egress
  namespace: studylife-developers
spec:
  podSelector: { matchLabels: { app: studylife-developers } }
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: studylife-scale } }
          podSelector: { matchLabels: { app: studylife-web } }
      ports:
        - { protocol: TCP, port: 8080 }
        - { protocol: TCP, port: 8443 }
