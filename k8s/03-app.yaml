# The service itself. Image tag is a placeholder ("0.1.0") overwritten by Flux's
# ImageUpdateAutomation the moment it first reconciles against a real published tag - mirrors
# studylife-webhooks' own k8s/03-app.yaml. This repo's Dockerfile reuses the aspnet base
# image's own "app" user (uid 1654, matching studylife's own k8s securityContext.runAsUser) -
# runAsNonRoot/runAsUser is safe here without live inspection, since it's this repo's own
# Dockerfile, not an opaque third-party image.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: studylife-developers-data
  namespace: studylife-developers
spec:
  accessModes: ["ReadWriteOnce"]
  # Longhorn (cross-node-replicated) instead of local-path - the single-file key store
  # (KeyStore) survives a node dying instead of needing a Velero restore.
  storageClassName: longhorn
  resources:
    requests: {storage: 64Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: studylife-developers
  namespace: studylife-developers
spec:
  replicas: 1
  strategy:
    # Single instance with an RWO volume (KeyStore is a plain JSON file, not built for
    # concurrent writers) - same reasoning as studylife-ai/studylife-webhooks.
    type: Recreate
  selector:
    matchLabels: {app: studylife-developers}
  template:
    metadata:
      labels: {app: studylife-developers}
      annotations:
        # Opt-in to homelab-infra's nightly Velero PVC backup: /app/data is the KeyStore,
        # i.e. every registered OAuth client of the marketplace. Losing it would invalidate
        # every issued client_id/secret at once, so unlike a cache this is worth the
        # kilobytes. Crash-consistent copy, same acceptance as studylife-webhooks.
        backup.velero.io/backup-volumes: data
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        fsGroup: 1654
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: studylife-developers
          image: ghcr.io/lukislp/studylife-developers:1.5.10 # set by the deploy-bump job (CI) on every release
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            # The key store is the only persisted state and it lives on the PVC below; the
            # image layer is never written to. The two emptyDirs cover the only paths the
            # .NET runtime itself writes (see volumeMounts).
            readOnlyRootFilesystem: true
          envFrom:
            - configMapRef: {name: studylife-developers-config}
            - secretRef: {name: studylife-developers-secrets}
          ports:
            - containerPort: 8080
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 250m, memory: 256Mi}
          # Recreate (above) means every rollout has a real gap between the old pod dying and
          # the new one serving - confirmed live at ~15s, almost entirely initialDelaySeconds
          # here rather than image pull or volume attach (both measured under 5s). This is a
          # small ASP.NET Core app with no DB/migration work at startup, so it's actually ready
          # well before 10s - tightened to shrink the user-visible 503 window on every deploy.
          #
          # Both probes set timeoutSeconds explicitly. The Kubernetes default of 1s is too
          # tight for a .NET app on the arm64 Raspberry Pi nodes this runs on: the weakest
          # node sits close to its memory limit, so an ordinary load spike pushes /health past
          # one second, the liveness probe fails failureThreshold times in a row and kubelet
          # restarts a container that was only busy. The readiness probe keeps its deliberately
          # short 2s period (see above) and therefore gets 3s rather than 5s, which is still
          # three times the default; liveness gets the full 5s plus 5 consecutive failures.
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 2
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 6
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: studylife-ca
              mountPath: /etc/studylife-ca
              readOnly: true
            # .NET creates its diagnostic IPC socket and debug pipes here on every start.
            - name: tmp
              mountPath: /tmp
            # $HOME of the aspnet image's app user (1654) - ASP.NET Core keeps its
            # DataProtection keyring under ~/.aspnet/DataProtection-Keys. It was already
            # ephemeral (container layer, and this Deployment uses Recreate), so an emptyDir
            # changes nothing functionally.
            - name: home
              mountPath: /home/app
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: studylife-developers-data}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
        - name: home
          emptyDir: {sizeLimit: 16Mi}
        - name: studylife-ca
          configMap: {name: studylife-internal-ca}
---
apiVersion: v1
kind: Service
metadata:
  name: studylife-developers
  namespace: studylife-developers
spec:
  type: ClusterIP
  selector: {app: studylife-developers}
  ports:
    - name: http
      port: 8080
      targetPort: 8080
