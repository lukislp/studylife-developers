# Non-secret runtime configuration. Flux-managed (see k8s/flux-deploy/kustomization.yaml) -
# kustomize-controller's ClusterRole grants it "configmaps" but deliberately NOT "secrets" -
# see k8s/02-secret.yaml for why that one stays bootstrap-only.
apiVersion: v1
kind: ConfigMap
metadata:
  name: studylife-developers-config
  namespace: studylife-developers
data:
  # Cluster-internal Service DNS for the paired studylife instance - this portal is
  # single-tenant, paired to exactly this one instance (see KeyStore's own doc comment). HTTPS
  # on the internal Service port, not the http one - StudyAtrium's own UseHttpsRedirection
  # middleware forces HTTPS unconditionally for every non-kube-probe request (found live by
  # studylife-ai/-mcp already, see their own k8s/*-studylife-ca.yaml) - a plain port-8080 rule
  # here would just get redirected to :8443, not actually reachable. StudyLife__CaCertPath
  # points at the mounted CA cert (k8s/05-studylife-ca.yaml) needed to trust that connection -
  # StudyAtrium's internal cert-manager CA isn't in any public trust store (see
  # Services/StudyLifeCaTrust.cs).
  StudyLife__BaseUrl: "https://studylife-web.studylife-scale.svc.cluster.local"
  StudyLife__CaCertPath: "/etc/studylife-ca/ca.crt"
  # KeyStore's single-file JSON store - must point inside the mounted PVC (k8s/03-app.yaml),
  # the default "data" (config.py-equivalent default) would otherwise land in the container's
  # ephemeral filesystem root and be lost on every restart.
  DataDir: "/app/data"
  # Host header pinning (audit 2026-11-16, finding M6): every other Host gets a 400, which is
  # what defeats DNS rebinding. The two gateway host names (k8s/06-httproute.yaml), the Service
  # DNS name StudyAtrium calls /internal/* with (its StudyLifeDevelopers__BaseUrl, the
  # certificate SAN in 07-tls-certificate.yaml) and localhost, which the kubelet probes send
  # explicitly (k8s/03-app.yaml). Ports are not part of the match.
  AllowedHosts: "studylife-developers.heim.lan;studylife-developers.lukas2311-homelab.com;studylife-developers.studylife-developers.svc.cluster.local;localhost"
  # Sign-in through the paired StudyAtrium instance (src/StudyLifeDevelopers/Auth). PublicUrl
  # is the canonical portal origin: the sign-in callback {PublicUrl}/auth/callback is registered
  # there, and a sign-in started on studylife-developers.heim.lan is moved to this host first.
  # StudyLifePublicUrl is the browser-facing StudyAtrium UI (its consent page), not the
  # cluster-internal StudyLife__BaseUrl above.
  PortalAuth__PublicUrl: "https://studylife-developers.lukas2311-homelab.com"
  PortalAuth__StudyLifePublicUrl: "https://studylife.lukas2311-homelab.com"
