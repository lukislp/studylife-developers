# Points Flux at this repo. Needs write access (not just read), since
# image-automation-controller pushes commits for new image tags directly to main. Reuses the
# cluster-wide "studylife-git-auth" secret (flux-system namespace, managed in the
# homelab-infra repo) - same pattern as every other satellite's own k8s/flux/01-git-source.yaml.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: studylife-developers
  namespace: flux-system
spec:
  interval: 5m
  url: https://github.com/lukislp/studylife-developers.git
  ref:
    branch: main
  secretRef:
    name: studylife-git-auth
