# Scans GHCR for new tags of this repo's image (.github/workflows/ci.yml "docker" job). The
# repo itself is private, but the built image package is set to public visibility (compiled
# artifact only, no source) - same as studylife-webhooks - so this needs no secretRef here and
# the Deployment (k8s/03-app.yaml) needs no imagePullSecrets.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: studylife-developers
  namespace: flux-system
spec:
  image: ghcr.io/lukislp/studylife-developers
  interval: 5m
