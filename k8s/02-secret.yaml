# IMPORTANT: the value below is an obvious placeholder, publicly visible in this repo - never
# use it like this in a real cluster. For a real deployment, create this Secret out of band
# (kubectl create secret / a secret manager) with a real value, then apply everything else here.
# Same convention as studylife-webhooks' own k8s/02-secret.yaml.
#
# Bootstrap-only, NOT Flux-managed - kustomize-controller's ClusterRole grants no permission on
# the "secrets" resource at all. Applied once by hand (kubectl apply -f k8s/02-secret.yaml)
# with the real value substituted first.
apiVersion: v1
kind: Secret
metadata:
  name: studylife-developers-secrets
  namespace: studylife-developers
type: Opaque
stringData:
  # MUST match the studylife repo's own StudyLifeDevelopers:SharedSecret exactly (see
  # DeveloperProxyClient there and the shared-secret check in this repo's Program.cs) - it's
  # the one thing that authenticates every /internal/* call as genuinely coming from StudyLife.
  StudyLifeDevelopers__SharedSecret: "REPLACE-ME"
